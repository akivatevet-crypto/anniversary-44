<meta charset="UTF-8">
<title>1982–2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700&family=Heebo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5ecdb;
    --paper-soft: #efe2c8;
    --ink: #241a12;
    --ink-soft: #3a291c;
    --sepia: #96603c;
    --amber: #e0993f;
    --amber-glow: rgba(224, 153, 63, 0.55);
    --rule: rgba(245, 236, 219, 0.22);
    --rule-dark: rgba(36, 26, 18, 0.14);
    --font-display: "Frank Ruhl Libre", "Times New Roman", serif;
    --font-body: "Heebo", "Segoe UI", sans-serif;
    --font-stamp: "Space Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wrap {
    direction: rtl;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- HERO / STAGE ---------- */

  .stage {
    position: relative;
    width: min(1080px, 92vw, 50.6vh);
    aspect-ratio: 1080 / 1920;
    overflow: hidden;
    background: var(--ink);
    isolation: isolate;
  }

  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .layer img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .layer-top {
    clip-path: circle(150% at 50% 88%);
    transition: clip-path 1.15s cubic-bezier(.65, 0, .35, 1);
    will-change: clip-path;
  }

  .stage.is-revealed .layer-top {
    clip-path: circle(0% at 50% 88%);
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(10, 6, 3, 0.55) 100%),
      linear-gradient(180deg, rgba(10,6,3,.72) 0%, rgba(10,6,3,.4) 13%, transparent 30%, transparent 76%, rgba(10,6,3,0.6) 100%);
    z-index: 3;
  }

  /* caption blocks over the stage */
  .cap {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding: clamp(14px, 2.5vh, 28px) 24px 0;
    pointer-events: none;
    transition: opacity .35s ease;
  }

  .cap-eyebrow {
    font-family: var(--font-stamp);
    font-size: 13px;
    letter-spacing: .28em;
    color: var(--amber);
    text-shadow: 0 0 14px var(--amber-glow);
    margin: 0 0 8px;
  }

  .cap h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(26px, 4.6vw, 52px);
    line-height: 1.14;
    color: var(--paper);
    margin: 0 0 12px;
    text-wrap: balance;
    text-shadow: 0 2px 24px rgba(0,0,0,.45);
  }

  .cap p {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: clamp(14px, 1.7vw, 18px);
    color: var(--paper-soft);
    max-width: 34ch;
    margin: 0;
    opacity: .88;
  }

  #cap-1982 { opacity: 1; }
  #cap-2026 { opacity: 0; }
  .stage.is-revealed #cap-1982 { opacity: 0; }
  .stage.is-revealed #cap-2026 { opacity: 1; transition-delay: .55s; }

  /* date stamp, camera-style */
  .stamp {
    position: absolute;
    bottom: clamp(96px, 15vh, 132px);
    left: clamp(16px, 4vw, 40px);
    z-index: 4;
    font-family: var(--font-stamp);
    font-variant-numeric: tabular-nums;
    font-size: clamp(15px, 2vw, 19px);
    letter-spacing: .12em;
    color: var(--amber);
    text-shadow: 0 0 10px var(--amber-glow), 0 0 2px rgba(0,0,0,.4);
    direction: ltr;
    transition: opacity .3s ease;
  }
  #stamp-1982 { opacity: 1; }
  #stamp-2026 { opacity: 0; }
  .stage.is-revealed #stamp-1982 { opacity: 0; }
  .stage.is-revealed #stamp-2026 { opacity: 1; transition-delay: .5s; }

  /* ticking counter overlay, shown only mid-transition */
  .tick {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  .tick span {
    font-family: var(--font-stamp);
    font-variant-numeric: tabular-nums;
    font-size: clamp(48px, 11vw, 128px);
    color: var(--paper);
    text-shadow: 0 0 40px rgba(224,153,63,.65);
    direction: ltr;
  }

  /* shutter button */
  .shutter-row {
    position: absolute;
    bottom: clamp(28px, 5vh, 48px);
    left: 0;
    right: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .shutter {
    appearance: none;
    border: none;
    cursor: pointer;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #4a3624, var(--ink) 70%);
    box-shadow:
      0 0 0 2px var(--amber),
      0 0 0 6px rgba(224,153,63,.25),
      0 8px 24px rgba(0,0,0,.5);
    position: relative;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .shutter::after {
    content: "";
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 18px var(--amber-glow);
    transition: inset .15s ease;
  }
  .shutter:hover { transform: scale(1.05); }
  .shutter:active::after { inset: 20px; }
  .shutter:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }

  .shutter-label {
    font-family: var(--font-stamp);
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--paper-soft);
    opacity: .8;
  }

  /* ---------- CLOSING PLAQUE ---------- */

  .plaque {
    background: var(--paper);
    color: var(--ink);
    padding: clamp(56px, 10vh, 96px) 24px clamp(64px, 12vh, 108px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
  }

  .plaque-eyebrow {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: .3em;
    color: var(--sepia);
    text-transform: uppercase;
  }

  .plaque-dates {
    display: flex;
    align-items: center;
    gap: clamp(14px, 3vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
  }

  .plaque-dates span.date {
    font-family: var(--font-stamp);
    font-variant-numeric: tabular-nums;
    font-size: clamp(22px, 4vw, 38px);
    letter-spacing: .04em;
    direction: ltr;
  }

  .plaque-dates span.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--amber);
    display: inline-block;
  }

  .plaque h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(24px, 3.4vw, 34px);
    margin: 6px 0 0;
    max-width: 22ch;
    text-wrap: balance;
  }

  .plaque hr {
    width: 56px;
    height: 1px;
    background: var(--rule-dark);
    border: none;
    margin: 4px 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .layer-top { transition: none; }
    #cap-1982, #cap-2026, #stamp-1982, #stamp-2026 { transition: none; }
  }
</style>

  <section class="plaque">
    <p class="plaque-eyebrow">44 שנות נישואים</p>
    <div class="plaque-dates">
      <span class="date">1.9.1982</span>
      <span class="dot"></span>
      <span class="date">1.9.2026</span>
    </div>
    <hr>
    <h2>מזל טוב ליום הנישואין שלנו</h2>
  </section>

<script>
  (function () {
    var stage = document.getElementById('stage');
    var btn = document.getElementById('shutterBtn');
    var label = document.getElementById('shutterLabel');
    var tick = document.getElementById('tick');
    var tickNum = document.getElementById('tick-num');
    var revealed = false;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var tickTimer = null;

    function runTicker(forward) {
      if (reduceMotion) return;
      var start = forward ? 1982 : 2026;
      var end = forward ? 2026 : 1982;
      var step = forward ? 1 : -1;
      var val = start;
      tickNum.textContent = String(val);
      tick.style.transition = 'opacity .12s ease';
      tick.style.opacity = '1';
      clearInterval(tickTimer);
      tickTimer = setInterval(function () {
        val += step;
        tickNum.textContent = String(val);
        if (val === end) {
          clearInterval(tickTimer);
          setTimeout(function () { tick.style.opacity = '0'; }, 140);
        }
      }, 24);
    }

    function setState(next) {
      revealed = next;
      stage.classList.toggle('is-revealed', revealed);
      btn.setAttribute('aria-pressed', String(revealed));
      btn.setAttribute('aria-label', revealed ? 'הצג את שנת 1982' : 'הצג 44 שנה קדימה');
      label.textContent = revealed ? 'בחזרה ל-1982' : '44 שנה קדימה';
      runTicker(revealed);
    }

    var chime = document.getElementById('chimeAudio');
    btn.addEventListener('click', function () {
      setState(!revealed);
      try {
        chime.currentTime = 0;
        chime.play();
      } catch (e) {}
    });
  })();
</script>
